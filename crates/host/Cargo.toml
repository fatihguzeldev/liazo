[package]
name = "liazo-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
schemars = { version = "1", features = ["uuid1"] }
liazo-core = { path = "../core" }
liazo-runtime = { path = "../runtime" }
liazo-transport = { path = "../transport" }
liazo-transcription = { path = "../transcription" }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
uuid.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
getrandom = "0.4"
subtle = "2"
futures-util = "0.3"
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
png = "=0.18.1"
liazo-runtime = { path = "../runtime", features = ["test-support"] }
hound = "3.5"
async-trait = "0.1"
tempfile = "3"
