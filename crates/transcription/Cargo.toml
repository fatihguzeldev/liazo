[package]
name = "liazo-transcription"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
metal = ["whisper-rs/metal", "whisper-rs/raw-api"]
vulkan = ["whisper-rs/vulkan", "whisper-rs/raw-api"]

[dependencies]
liazo-core = { path = "../core" }
serde.workspace = true
thiserror.workspace = true
whisper-rs = { version = "=0.16.0", features = ["raw-api"] }
rubato = { version = "=5.0.1", default-features = false }
audioadapter-buffers = "5.1"
uuid.workspace = true
tokio.workspace = true

[dev-dependencies]
hound = "3.5"
serde_json.workspace = true
