[package]
name = "liazo-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
liazo-core = { path = "../core" }
liazo-transport = { path = "../transport" }
liazo-transcription = { path = "../transcription" }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
uuid.workspace = true
bytes.workspace = true
serde.workspace = true
thiserror.workspace = true
async-trait = "0.1"
sha2 = "0.10"
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled", "limits", "fallible_uint"] }
serde_json.workspace = true

[dev-dependencies]
hound = "3.5"
tempfile = "3"
