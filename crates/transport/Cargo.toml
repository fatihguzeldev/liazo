[package]
name = "liazo-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
schemars = { version = "1", features = ["uuid1"] }
tokio.workspace = true
thiserror.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
ring = "0.17"
subtle = "2.6"
tokio-util = { version = "0.7", features = ["rt"] }
uuid.workspace = true
keyring-core = "1.0"
zeroize = "1"
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[dev-dependencies]
liazo-core = { path = "../core" }
bytes.workspace = true
