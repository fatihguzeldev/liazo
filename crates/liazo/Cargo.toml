[package]
name = "liazo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
metal = ["liazo-host/metal"]
vulkan = ["liazo-host/vulkan"]

[dependencies]
liazo-core = { path = "../core" }
liazo-runtime = { path = "../runtime" }
liazo-host = { path = "../host" }
liazo-transport = { path = "../transport" }
liazo-transcription = { path = "../transcription" }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid.workspace = true
serde_json.workspace = true
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
directories = "6"
if-addrs = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
liazo-macos = { path = "../macos" }
security-framework = "3.7"

[dev-dependencies]
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "transport-child-process"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
